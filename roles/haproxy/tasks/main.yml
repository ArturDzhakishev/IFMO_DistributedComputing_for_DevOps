- name: Создать директорию haproxy
  ansible.builtin.file:
    path: haproxy/
    state: directory
    mode: '0755'

- name: Скопировать haproxy.cfg
  ansible.builtin.template:
    src: haproxy.cfg.j2
    dest: haproxy/haproxy.cfg
    mode: '0755'

- name: Создать пользователя haproxy_check для проверки доступности из HAProxy
  community.mysql.mysql_user:
    name: haproxy_check
    host: '%'
    password: ''
    priv: '*.*:USAGE'
    state: present
    login_host: "{{ galera1_ip }}"
    login_user: root
    login_password: "{{ mysql_root_password }}"

- name: Запуск HAProxy container
  community.docker.docker_container:
    name: "{{ loadbalancer }}"
    image: haproxy:alpine
    ports:
      - "3308:3308"
      - "8404:8404"
    volumes:
      - "./haproxy/haproxy.cfg:/usr/local/etc/haproxy/haproxy.cfg:ro"
    restart_policy: unless-stopped
    networks:
      - name: wpnet

- name: Создать дамп базы данных с мастера (ДЗ2)
  community.mysql.mysql_db:
    state: dump
    name: wordpress
    target: "{{ project_dir }}/master_dump.sql"
    login_host: "127.0.0.1"
    login_port: "{{ mysql_master_port }}"
    login_user: "{{ mysql_root_login }}"
    login_password: "{{ mysql_root_password }}"
    dump_extra_args: "--skip-set-charset"

- name: Остановить и удалить контенйер wordpress, mysql-master, mysql-slave
  community.docker.docker_container:
    name: "{{ item }}"
    state: absent
    force_kill: true
    cleanup: true
  loop:
    - wordpress
    - mysql-master
    - mysql-slave

- name: Установить mariadb-client
  ansible.builtin.apt:
    name: mariadb-client
    state: present
  become: true
  when: ansible_facts['os_family'] == 'Debian'

- name: Заменить collation utf8mb4_0900_ai_ci на utf8mb4_unicode_ci
  ansible.builtin.replace:
    path: "{{ project_dir }}/master_dump.sql"
    regexp: 'utf8mb4_0900_ai_ci'
    replace: 'utf8mb4_unicode_ci'


- name: Выполнить дамп на кластере
  community.mysql.mysql_db:
    state: import
    name: wordpress
    target: "{{ project_dir }}/master_dump.sql"
    login_host: "127.0.0.1"
    login_port: "{{ haproxy_port }}"
    login_user: "{{ mysql_root_login }}"
    login_password: "{{ mysql_root_password }}"

- name: Запустить контейнер Wordpress
  community.docker.docker_container:
    name: wordpress
    image: wordpress:latest
    restart_policy: always
    env:
      WORDPRESS_DB_HOST: "{{ loadbalancer }}:3308"
      WORDPRESS_DB_USER: "{{ mysql_user }}"
      WORDPRESS_DB_PASSWORD: "{{ mysql_password }}"
      WORDPRESS_DB_NAME: "{{ mysql_database }}"
    published_ports:
      - "80:80"
    networks:
      - name: wpnet
