- name: Создать тома для первого узла
  community.docker.docker_volume:
    name: galera1_data
  # loop: "{{ galera_nodes }}"

- name: Создать тома для  каждого узла
  community.docker.docker_volume:
    name: "{{ item.name }}_data"
  loop: "{{ galera_nodes }}"

